spring:
  application:
    name: industrial-facility-parameter-bus-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/YOUR_DB}
    username: ${DB_USERNAME:data_storage}
    password: ${DB_PASSWORD:data_storage}
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8080}

mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:mqtt-rest-service}
  topic: ${MQTT_TOPIC:sensors/data}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}