spring:
  application:
    name: industrial-facility-parameter-bus-api

server:
  port: ${SERVER_PORT:8080}

mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:mqtt-rest-service}
  topic: ${MQTT_TOPIC:sensors/data}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}